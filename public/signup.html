<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Savoria Signup</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Georgia, serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;

  background:
  linear-gradient(rgba(0,0,0,0.35),
  rgba(0,0,0,0.35)),
  url('images/homepg.jpeg');

  background-size:cover;
  background-position:center;
}

.signup-box{
  width:380px;
  padding:40px;

  border-radius:30px;

  background:rgba(255,255,255,0.12);

  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.2);

  box-shadow:0 8px 32px rgba(0,0,0,0.3);

  text-align:center;

  color:white;
}

.signup-box h1{
  font-size:38px;
  margin-bottom:10px;
  font-weight:normal;
}

.signup-box p{
  font-size:14px;
  opacity:0.8;
  margin-bottom:25px;
}

.input-box{
  margin-top:15px;
}

.input-box input{
  width:100%;
  padding:14px;

  border:none;
  outline:none;

  border-radius:14px;

  background:rgba(255,255,255,0.18);

  color:white;

  font-size:15px;
}

.input-box input::placeholder{
  color:#eee;
}

.signup-btn{
  width:100%;
  padding:14px;

  margin-top:22px;

  border:none;
  border-radius:14px;

  background:#b89b62;

  color:white;

  font-size:18px;

  cursor:pointer;

  transition:0.3s;
}

.signup-btn:hover{
  transform:scale(1.03);
  background:#c8ab73;
}

.login-link{
  margin-top:18px;
}

.login-link a{
  color:white;
  text-decoration:none;
  opacity:0.8;
}

.login-link a:hover{
  opacity:1;
}

</style>
</head>

<body>

<div class="signup-box">

  <h1>Savoria</h1>

  <p>Create your luxury dining account ✨</p>

<formid="signupForm" autocomplete="off">

<div class="input-box">
  <input type="text" id="name" placeholder="👤 Full Name" pattern="[a-zA-Z\s]+">
</div>

<div class="input-box">
  <input type="email" id="email" placeholder="📧 Email">
</div>

<div class="input-box">
  <input type="text" id="phone" pattern="^\d{10}$"placeholder="📱 Phone Number">
</div>

<div class="input-box">
  <input type="password" id="password" placeholder="🔑 Password">
</div>
<button type="submit" class="signup-btn">
  ✨ Create Account ✨
</button>

</form>

  <div class="login-link">
    <a href="/">Already have an account?</a>
  </div>

</div>
<script>

document.getElementById("signupForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const name =
    document.getElementById("name").value;

    const email =
    document.getElementById("email").value;

    const phone =
    document.getElementById("phone").value;

    const password =
    document.getElementById("password").value;

    const res = await fetch("/api/signup", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            name,
            email,
            phone,
            password
        })

    });

    const data = await res.json();

    if(data.success){

        alert("Account Created ✨");

        window.location.href = "/";

    } else {

       alert(data.message || "Signup Failed");
console.log(data);

    }

});

</script>
</body>
</html>
